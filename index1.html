        async function sha256(message) {
          const msgBuffer = new TextEncoder().encode(message);
          const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function authLogin(username, password) {
          const entry = AUTH_DB[username];
          if (!entry) return null;
          const h = await sha256(password);
          if (h !== entry.hash) return null;
          return { username, role: entry.role };
        }

        function getPermissions(role) {
          if (!role) return { canEdit: false, canCheckIn: false, canAdmin: false, myStudentId: null };
          if (role === 'admin') return { canEdit: true, canCheckIn: true, canAdmin: true, myStudentId: null };
          if (role === 'teacher') return { canEdit: true, canCheckIn: false, canAdmin: false, myStudentId: null };
          if (role.startsWith('student:')) {
            const id = parseInt(role.split(':')[1]);
            return { canEdit: false, canCheckIn: true, canAdmin: false, myStudentId: id };
          }
          return { canEdit: false, canCheckIn: false, canAdmin: false, myStudentId: null };
        }

        // --- 核心組件與邏輯 ---
        // 使用 window.storage 雲端持久化儲存（跨裝置、跨瀏覽器同步）
        function useCloudStorage(key, initialValue) {
          const [storedValue, setStoredValue] = useState(initialValue);
          const [loaded, setLoaded] = useState(false);

          // 初始載入：從雲端讀取資料
          useEffect(() => {
            async function loadFromCloud() {
              try {
                const result = await window.storage.get(key);
                if (result && result.value !== undefined) {
                  const parsed = JSON.parse(result.value);
                  if (typeof initialValue === 'object' && parsed !== null && !Array.isArray(initialValue)) {
                    setStoredValue(prev => ({ ...initialValue, ...parsed }));
                  } else {
                    setStoredValue(parsed !== null ? parsed : initialValue);
                  }
                }
              } catch (error) {
                // key 不存在或其他錯誤，使用預設值
                console.log("Cloud storage: key not found, using default:", key);
              } finally {
                setLoaded(true);
              }
            }
            loadFromCloud();
          }, [key]);

          const setValue = useCallback((value) => {
            setStoredValue((prev) => {
              const valueToStore = value instanceof Function ? value(prev) : value;
              // 非同步寫入雲端
              window.storage.set(key, JSON.stringify(valueToStore)).catch(err => {
                console.warn("Cloud storage write warning:", err);
              });
              return valueToStore;
            });
          }, [key]);

          return [storedValue, setValue, loaded];
        }

        // 相容性包裝：對外介面同原本的 useLocalStorage
        function useLocalStorage(key, initialValue) {
          const [value, setValue, loaded] = useCloudStorage(key, initialValue);
          return [value, setValue, loaded];
        }

        const ClockDisplay = ({ clockStyleIndex, onClick }) => {
          const [time, setTime] = useState(new Date());
          useEffect(() => {
            const timer = setInterval(() => setTime(new Date()), 1000);
            return () => clearInterval(timer);
          }, []);
          const timeStr = time.toLocaleTimeString('zh-TW', { hour12: false });
          const clockStyles = [
            { name: "數位霓虹", class: "text-[#eaff00] font-mono drop-shadow-[0_0_8px_rgba(234,255,0,0.6)]", bg: "bg-slate-900 px-6 py-1 rounded-2xl" },
            { name: "圓潤泡泡", class: "text-pink-500 font-black tracking-widest", bg: "bg-white px-8 py-2 rounded-full border-4 border-pink-100 shadow-inner" },
            { name: "黑板手寫", class: "text-yellow-100 font-serif italic", bg: "bg-[#2a453b] px-6 py-1 rounded-lg border-2 border-white/20" },
            { name: "簡約卡片", class: "text-slate-700 font-light", bg: "bg-white px-6 py-1 rounded-xl shadow-sm border border-slate-100" },
            { name: "經典木質", class: "text-amber-900 font-serif font-bold", bg: "bg-amber-100 px-6 py-1 rounded-md border-b-4 border-amber-300 shadow-sm" }
          ];
          const currentStyle = clockStyles[clockStyleIndex || 0] || clockStyles[0];
          return (
            <div className={`cursor-pointer transition-all active:scale-95 ${currentStyle.bg}`} onClickCapture={(e) => { e.stopPropagation(); onClick(); }}>
              <div className={`text-4xl md:text-5xl font-bold ${currentStyle.class}`}>{timeStr}</div>
            </div>
          );
        };

        function SchoolCheckInKing({ currentUser, onLogout }) {
          const perms = getPermissions(currentUser?.role);
          const [isMounted, setIsMounted] = useState(false);
          useEffect(() => {
            const timer = setTimeout(() => { setIsMounted(true); }, 200); 
            return () => clearTimeout(timer);
          }, []);

          const [leftPaneWidth, setLeftPaneWidth] = useState(45);
          const [taskHeight, setTaskHeight] = useState(30);
          const [taskWidth, setTaskWidth] = useState(30);
          
          const [isDraggingH, setIsDraggingH] = useState(false);
          const [isDraggingV, setIsDraggingV] = useState(false);
          const [isDraggingTaskW, setIsDraggingTaskW] = useState(false); 

          const [toastMessage, setToastMessage] = useState('');
          const showToast = useCallback((msg) => {
            setToastMessage(msg);
            setTimeout(() => setToastMessage(''), 3500);
          }, []);

          const [settings, setSettings, settingsLoaded] = useLocalStorage('king-v6-settings', {
            totalStudents: 30, idealTime: '07:30', taskEndTime: '08:30', cbDirection: 'horizontal',
            cbFont: 'sans', cbFontSize: 32, clockStyle: 0, viewMode: 'both', showTasks: true,
            showListNumber: true, emptyIds: '', leaveIds: '', clubIds: '', bulkText: '', 
          });

          const [isEditing, setIsEditing] = useState(false);
          // 僅 admin/teacher 可進入編輯模式
          const canActuallyEdit = perms.canEdit;
          const [students, setStudents, studentsLoaded] = useLocalStorage('king-v6-students', []);
          const [contactBookData, setContactBookData, cbLoaded] = useLocalStorage('king-v6-cb-data', {});
          const [taskData, setTaskData, taskLoaded] = useLocalStorage('king-v6-task-data', {});
          const cloudDataLoaded = studentsLoaded && cbLoaded && taskLoaded;
          const [viewDate, setViewDate] = useState(new Date());
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);
          const [unlockId, setUnlockId] = useState('');

          const formatDateKey = useCallback((date) => {
            if (!date) return new Date().toISOString().split('T')[0];
            const d = new Date(date);
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
          }, []);

          const currentViewDateKey = formatDateKey(viewDate);

          useEffect(() => {
            if (!isMounted) return;
            const isWeekend = viewDate.getDay() === 0 || viewDate.getDay() === 6;
            const isToday = currentViewDateKey === formatDateKey(new Date());
            setContactBookData(prev => {
              if (prev[currentViewDateKey] !== undefined) return prev;
              return { ...prev, [currentViewDateKey]: (isToday && !isWeekend) ? "國習P.30-P.32\n國作L3\n數作Ch.3\n明帶水彩用具\n交午餐回條\n做家事" : "" };
            });
            setTaskData(prev => {
              if (prev[currentViewDateKey] !== undefined) return prev;
              return { ...prev, [currentViewDateKey]: (isToday && !isWeekend) ? "靜心晨讀10分鐘\n繳交今日作業\n抄寫聯絡簿" : "" };
            });
          }, [currentViewDateKey, viewDate, setContactBookData, setTaskData, isMounted, formatDateKey]);

          useEffect(() => {
            if (!isMounted) return;
            setStudents(prev => {
              let baseList = Array.from({ length: settings.totalStudents }, (_, i) => ({ id: i + 1, name: '', type: 'normal' }));
              const safeEmptyIds = settings.emptyIds || '';
              const safeImportText = settings.bulkText || '';
              const emptyArr = safeEmptyIds.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

              if (safeImportText.trim() !== '') {
                const lines = safeImportText.split('\n').filter(l => l.trim() !== '');
                let autoId = 1;
                lines.forEach((line) => {
                  let name = line.trim();
                  let id = null;
                  const match = line.match(/^(\d+)[\s,\.\t]+(.+)$/);
                  if (match) {
                    id = parseInt(match[1], 10);
                    name = match[2].trim();
                    autoId = id + 1; 
                  } else if (/^\d+$/.test(name)) {
                     id = parseInt(name, 10);
                     name = '';
                     autoId = id + 1;
                  } else {
                     while (emptyArr.includes(autoId) && autoId <= settings.totalStudents) { autoId++; }
                     id = autoId;
                     autoId++; 
                  }
                  const student = baseList.find(s => s.id === id);
                  if (student) {
                    student.name = name;
                    if (name === '空號') student.type = 'empty';
                  }
                });
              }

              const leaveArr = (settings.leaveIds || '').split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
              const clubArr = (settings.clubIds || '').split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

              return baseList.map(base => {
                const existing = prev.find(s => s.id === base.id) || { arrivalTime: null, status: 'absent' };
                let finalType = base.type;
                if (emptyArr.includes(base.id)) finalType = 'empty';
                else if (leaveArr.includes(base.id)) finalType = 'leave';
                else if (clubArr.includes(base.id)) finalType = 'club';

                return { ...base, type: finalType, arrivalTime: existing.arrivalTime, status: existing.status };
              });
            });
          }, [settings.totalStudents, settings.emptyIds, settings.leaveIds, settings.clubIds, settings.bulkText, isMounted, setStudents]);

          useEffect(() => {
            const handleMouseMove = (e) => {
              if (isDraggingH) {
                const newWidth = (e.clientX / window.innerWidth) * 100;
                if (newWidth > 20 && newWidth < 80) setLeftPaneWidth(newWidth);
              }
              if (isDraggingV) {
                const container = document.getElementById('right-pane-container');
                if (container) {
                  const rect = container.getBoundingClientRect();
                  const newHeight = ((rect.bottom - e.clientY) / rect.height) * 100;
                  if (newHeight > 10 && newHeight < 60) setTaskHeight(newHeight);
                }
              }
              if (isDraggingTaskW) {
                const container = document.getElementById('content-area-container');
                if (container) {
                  const rect = container.getBoundingClientRect();
                  const newWidth = ((e.clientX - rect.left) / rect.width) * 100;
                  if (newWidth > 15 && newWidth < 50) setTaskWidth(newWidth);
                }
              }
            };
            const handleMouseUp = () => { setIsDraggingH(false); setIsDraggingV(false); setIsDraggingTaskW(false); };
            
            if (isDraggingH || isDraggingV || isDraggingTaskW) {
              document.addEventListener('mousemove', handleMouseMove);
              document.addEventListener('mouseup', handleMouseUp);
              document.addEventListener('touchmove', (e) => handleMouseMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }), { passive: false });
              document.addEventListener('touchend', handleMouseUp);
            }
            return () => {
              document.removeEventListener('mousemove', handleMouseMove);
              document.removeEventListener('mouseup', handleMouseUp);
              document.removeEventListener('touchmove', handleMouseMove);
              document.removeEventListener('touchend', handleMouseUp);
            };
          }, [isDraggingH, isDraggingV, isDraggingTaskW]);

          const handleCheckIn = useCallback((id) => {
            // 學生只能打自己的卡
            if (perms.myStudentId !== null && perms.myStudentId !== id) return;
            setStudents(prev => prev.map(s => {
              if (s.id !== id || s.type !== 'normal' || s.status !== 'absent') return s;
              const now = new Date();
              const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
              const [h, m] = (settings.idealTime || '07:30').split(':').map(Number);
              const ideal = new Date(); ideal.setHours(h, m, 0, 0);
              return { ...s, arrivalTime: timeStr, status: now <= ideal ? 'on-time' : 'late' };
            }));
          }, [settings.idealTime, setStudents]);

          const handleUnlock = () => {
            if (!perms.canAdmin) { showToast('⛔ 無此操作權限'); return; }
            const id = parseInt(unlockId);
            setStudents(prev => prev.map(s => s.id === id ? { ...s, arrivalTime: null, status: 'absent' } : s));
            setUnlockId('');
          };

          const triggerDownload = (content, fileName, mimeType) => {
            try {
              const blob = new Blob([content], { type: mimeType });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = fileName;
              a.target = '_blank';
              document.body.appendChild(a); 
              a.click();
              setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 150);
              showToast('✅ 檔案已請求下載！');
            } catch (err) {
              console.error(err);
              showToast('⚠️ 下載被預覽環境阻擋，請確認權限或在新分頁開啟。');
            }
          };

          const exportCSV = () => {
            const dateStr = formatDateKey(viewDate);
            const cbText = (contactBookData[currentViewDateKey] || '').replace(/"/g, '""');
            const taskText = (taskData[currentViewDateKey] || '').replace(/"/g, '""');
            
            const currentStats = {
              total: students.filter(s => s.type !== 'empty').length,
              present: students.filter(s => (s.status === 'on-time' || s.status === 'late')).length,
              late: students.filter(s => s.status === 'late').length,
              absent: students.filter(s => s.status === 'absent' && s.type === 'normal').length,
              leave: students.filter(s => s.type === 'leave').length,
              club: students.filter(s => s.type === 'club').length,
            };

            let csvContent = '\uFEFF'; 
            csvContent += `報表日期,${dateStr}\n\n`;
            csvContent += `【今日聯絡簿】\n"${cbText}"\n\n`;
            csvContent += `【早自習任務】\n"${taskText}"\n\n`;
            csvContent += `【出缺席統計】\n應到,已到,遲到,未到,請假,社團\n`;
            csvContent += `${currentStats.total},${currentStats.present},${currentStats.late},${currentStats.absent},${currentStats.leave},${currentStats.club}\n\n`;
            csvContent += `【學生打卡明細】\n座號,姓名,狀態,打卡時間\n`;
            
            students.forEach(s => {
              if (s.type === 'empty') return;
              let statusText = '未到';
              if (s.status === 'on-time') statusText = '準時';
              else if (s.status === 'late') statusText = '遲到';
              else if (s.type === 'leave') statusText = '請假';
              else if (s.type === 'club') statusText = '社團';
              
              const name = (s.name || '').replace(/"/g, '""');
              const time = s.arrivalTime || '';
              csvContent += `${s.id},"${name}",${statusText},${time}\n`;
            });
            triggerDownload(csvContent, `⭐學生打卡報表_${dateStr}.csv`, 'text/csv;charset=utf-8;');
          };

          const exportData = () => {
            const data = { settings, students, contactBookData, taskData };
            triggerDownload(JSON.stringify(data), `⭐學生打卡＆數位聯絡簿⭐_備份_${formatDateKey(new Date())}.json`, 'application/json');
          };

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const json = JSON.parse(event.target.result);
                if (json.settings) {
                  setSettings(prev => {
                    const merged = { ...prev, ...json.settings };
                    merged.emptyIds = merged.emptyIds || '';
                    merged.leaveIds = merged.leaveIds || '';
                    merged.clubIds = merged.clubIds || '';
                    merged.bulkText = merged.bulkText || '';
                    merged.cbDirection = merged.cbDirection || 'horizontal';
                    merged.cbFont = merged.cbFont || 'sans';
                    return merged;
                  });
                }
                if (json.students) setStudents(json.students);
                if (json.contactBookData) setContactBookData(prev => ({ ...prev, ...json.contactBookData }));
                if (json.taskData) setTaskData(prev => ({ ...prev, ...json.taskData }));
                showToast('✅ 匯入成功！');
              } catch (err) { showToast('❌ 匯入失敗，檔案格式不正確。'); }
            };
            reader.readAsText(file);
            e.target.value = '';
          };

          if (!isMounted || !cloudDataLoaded || !settingsLoaded) {
            return (
              <div className="min-h-screen w-full bg-[#f3f4f6] flex flex-col items-center justify-center font-sans">
                <div className="w-12 h-12 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin mb-4"></div>
                <h2 className="text-xl font-black text-slate-600 tracking-widest">
                  {!cloudDataLoaded ? '從雲端載入資料中...' : '系統準備中...'}
                </h2>
                <p className="text-sm text-slate-400 mt-2">資料儲存於雲端，跨裝置同步</p>
              </div>
            );
          }

          const stats = {
            total: students.filter(s => s.type !== 'empty').length,
            present: students.filter(s => (s.status === 'on-time' || s.status === 'late')).length,
            late: students.filter(s => s.status === 'late').length,
            absent: students.filter(s => s.status === 'absent' && s.type === 'normal').length,
            leave: students.filter(s => s.type === 'leave').length,
            club: students.filter(s => s.type === 'club').length,
          };

          const parseListContent = (text) => text ? text.split('\n').map(line => line.trim()).filter(line => line.length > 0) : [];
          const cbItems = parseListContent(contactBookData[currentViewDateKey]);
          const taskItems = parseListContent(taskData[currentViewDateKey]);

          const renderText = (text) => {
            const isVertical = settings.cbDirection === 'vertical';
            const isZhuyinOnly = settings.cbFont === 'zhuyinOnly';
            const isBopomofo = settings.cbFont === 'bopomofo';

            const regex = /([a-zA-Z]+[\.\-]?[0-9]+[\.\)]?|[a-zA-Z0-9]+[\.\)]?|[\-\/]|數|卷)/;
            const testRegex = /^([a-zA-Z]+[\.\-]?[0-9]+[\.\)]?|[a-zA-Z0-9]+[\.\)]?|[\-\/])$/;
            
            const parts = text.split(regex);
            return parts.map((part, i) => {
              if (!part) return null;

              if ((part === '數' || part === '卷') && (isZhuyinOnly || isBopomofo)) {
                if (isZhuyinOnly) {
                  return <span key={i} style={{ fontSize: '1.65em', lineHeight: '1', verticalAlign: 'middle', textAlign: 'center' }}>{part === '數' ? '述' : '眷'}</span>;
                } else if (isBopomofo && isVertical) {
                  return (
                    <span key={i} style={{ display: 'inline-block', position: 'relative', width: '1em', height: '1em', verticalAlign: 'middle', fontFamily: '"標楷體", "DFKai-SB", "BiauKai", serif' }}>
                      <span style={{ position: 'absolute', top: '50%', left: '28%', transform: 'translate(-50%, -50%)', fontSize: '0.95em', display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: '1', letterSpacing: 'normal' }}>{part}</span>
                      <div style={{ position: 'absolute', top: '50%', left: '98%', transform: 'translate(-50%, -50%)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', fontSize: part === '數' ? '0.38em' : '0.28em', lineHeight: '1.1', fontFamily: 'sans-serif', writingMode: 'horizontal-tb', letterSpacing: 'normal' }}>
                        {part === '數' ? <><span style={{ marginBottom: '0.05em' }}>ㄕ</span><span style={{ position: 'relative', display: 'inline-block' }}>ㄨ<span style={{ position: 'absolute', top: '-0.15em', left: '100%', marginLeft: '0.05em', fontSize: '0.9em', fontWeight: 'bold', lineHeight: '1' }}>ˋ</span></span></> : <><span style={{ marginBottom: '0.02em' }}>ㄐ</span><span style={{ marginBottom: '0.02em' }}>ㄩ</span><span style={{ position: 'relative', display: 'inline-block' }}>ㄢ<span style={{ position: 'absolute', top: '-0.15em', left: '100%', marginLeft: '0.05em', fontSize: '0.9em', fontWeight: 'bold', lineHeight: '1' }}>ˋ</span></span></>}
                      </div>
                    </span>
                  );
                } else if (isBopomofo) {
                  return (
                    <span key={i} style={{ display: 'inline-flex', alignItems: 'center', position: 'relative', verticalAlign: 'middle', fontFamily: '"標楷體", "DFKai-SB", "BiauKai", serif', marginRight: '0.1em' }}>
                      <span className="leading-none" style={{ letterSpacing: 'normal' }}>{part}</span> 
                      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', fontSize: part === '數' ? '0.45em' : '0.32em', lineHeight: '1.1', paddingLeft: '0.02em', fontFamily: 'sans-serif', writingMode: 'horizontal-tb', letterSpacing: 'normal' }}>
                        {part === '數' ? <><span style={{ marginBottom: '0.05em' }}>ㄕ</span><span style={{ position: 'relative', display: 'inline-block' }}>ㄨ<span style={{ position: 'absolute', top: '-0.15em', left: '100%', marginLeft: '0.05em', fontSize: '0.9em', fontWeight: 'bold', lineHeight: '1' }}>ˋ</span></span></> : <><span style={{ marginBottom: '0.02em' }}>ㄐ</span><span style={{ marginBottom: '0.02em' }}>ㄩ</span><span style={{ position: 'relative', display: 'inline-block' }}>ㄢ<span style={{ position: 'absolute', top: '-0.15em', left: '100%', marginLeft: '0.05em', fontSize: '0.9em', fontWeight: 'bold', lineHeight: '1' }}>ˋ</span></span></>}
                      </div>
                    </span>
                  );
                }
              } else if (testRegex.test(part) && part.length <= 6) {
                const isDash = part === '-';
                return <span key={i} className={`${isVertical ? 'tate-chu-yoko' : ''} inline-block font-sans`} style={{ margin: (isBopomofo && !isVertical) ? '0 0.1em 0 0.2em' : '0 0.1em', fontWeight: isZhuyinOnly ? '900' : 'normal', verticalAlign: 'middle', fontSize: isZhuyinOnly ? '1.4em' : '1em', letterSpacing: 'normal', transform: (isVertical && isDash) ? 'rotate(90deg)' : 'none', position: (isBopomofo && !isVertical) ? 'relative' : 'static', top: (isBopomofo && !isVertical) ? '-0.15em' : '0' }}>{part}</span>;
              }
              return <span key={i} style={isZhuyinOnly ? { fontSize: '1.65em', lineHeight: '1', verticalAlign: 'middle', textAlign: 'center' } : { verticalAlign: 'middle', lineHeight: '1.2', position: (isBopomofo && !isVertical) ? 'relative' : 'static', top: (isBopomofo && !isVertical) ? '-0.15em' : '0' }}>{part}</span>;
            });
          };

          const getWeekdayString = (date) => ['日', '一', '二', '三', '四', '五', '六'][date.getDay()];
          const getFontClass = () => settings.cbFont === 'bopomofo' ? "font-bopomofo" : settings.cbFont === 'zhuyinOnly' ? "font-zhuyin-only" : settings.cbFont === 'kai' ? "font-kai" : "font-sans";

          return (
            <div className="min-h-[100dvh] w-full bg-[#f3f4f6] flex flex-col font-sans selection:bg-pink-200 overflow-hidden">
              {(currentUser?.role === 'guest' || (currentUser?.role && currentUser.role.startsWith('student:'))) && (
                <div style={{ pointerEvents: 'none' }} className="fixed top-0 left-0 right-0 z-[9999] text-center py-1 text-xs font-bold bg-amber-400 text-amber-900">
                  {currentUser?.role === 'guest' ? '👁️ 訪客模式：僅供閱讀，所有操作均受限' : `🎒 學生模式：您只能操作自己（座號 ${String(perms.myStudentId).padStart(2,'0')} 號）的打卡`}
                </div>
              )}
              {toastMessage && (
                <div style={{ pointerEvents: 'none' }} className="fixed top-1/4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] z-[999999] animate-bounce font-bold text-sm text-center tracking-wide border-2 border-white/20">
                  {toastMessage}
                </div>
              )}

              <header className="flex-none pt-14 pb-4 bg-white px-4 md:px-6 flex flex-wrap items-center justify-between border-b-2 border-pink-50 shadow-sm relative z-[99999]">
                <div className="flex items-center gap-2 mb-2 lg:mb-0">
                  <div className="bg-gradient-to-r from-yellow-400 to-pink-500 p-2.5 rounded-xl shadow-sm rotate-3">
                    <Star className="text-white w-5 h-5 fill-current pointer-events-none" />
                  </div>
                  <h1 className="text-xl md:text-2xl font-black text-slate-700 pointer-events-none">⭐學生打卡＆數位聯絡簿⭐</h1>
                </div>
                <div className="flex items-center gap-2 flex-wrap">
                  {currentUser && (
                    <div className="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl shadow-sm">
                      <span className="text-xs font-bold text-slate-400">
                        {currentUser.role === 'admin' ? '👑 管理者' : currentUser.role === 'teacher' ? '👩‍🏫 教師' : currentUser.role === 'guest' ? '👁️ 訪客' : `🎒 學生${String(perms.myStudentId).padStart(2,'0')}`}
                      </span>
                      <span className="text-xs text-slate-300 hidden sm:inline">|</span>
                      <span className="text-xs font-bold text-pink-500 hidden sm:inline">{currentUser.username}</span>
                      <button type="button" onClick={onLogout} className="text-xs text-slate-400 hover:text-red-500 font-bold transition-colors ml-1" title="登出">✕ 登出</button>
                    </div>
                  )}
                <div className="flex items-center gap-2 md:gap-3 flex-wrap">
                  <div className="flex bg-pink-50/50 p-1.5 rounded-xl sm:mr-4 border border-pink-100 shadow-sm">
                    <button type="button" onClickCapture={(e) => { e.stopPropagation(); setSettings({...settings, viewMode:'both'}); }} className={`flex items-center gap-2 px-4 py-2.5 md:px-5 md:py-3 rounded-lg text-sm font-black transition-all hover:bg-white/90 ${settings.viewMode==='both'?'bg-white shadow-md text-pink-600':'text-slate-500'}`}>

                      </section>
                      <section>
                        <h4 className="text-sm md:text-base font-bold text-slate-400 mb-3 border-b border-slate-100 pb-2 flex items-center gap-2">👥 打卡學生名單設定</h4>
                        <div className="mb-4 bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden">
                          <div className="absolute top-0 left-0 w-1 h-full bg-pink-400"></div><h5 className="font-bold text-slate-700 text-sm md:text-base mb-3 flex items-center">方式 A：僅使用數字座號 <span className="text-[10px] md:text-xs text-pink-600 bg-pink-100 px-2 py-0.5 rounded-full ml-2 font-black tracking-wide">優先使用</span></h5>
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <div><label className="block text-sm font-bold text-slate-500 mb-1">總人數:</label><input type="number" min="1" max="100" value={settings.totalStudents} onChange={(e) => setSettings({...settings, totalStudents: parseInt(e.target.value) || 30})} className="w-full p-2 md:p-3 border border-slate-200 rounded-lg text-base bg-white focus:ring-2 focus:ring-pink-300 outline-none" /></div>
                            <div><label className="block text-sm font-bold text-slate-500 mb-1">空號 (逗號分隔):</label><input type="text" placeholder="例: 4,14" value={settings.emptyIds} onChange={(e) => setSettings({...settings, emptyIds: e.target.value})} className="w-full p-2 md:p-3 border border-slate-200 rounded-lg text-base bg-white focus:ring-2 focus:ring-pink-300 outline-none" /></div>
                            <div><label className="block text-sm font-bold text-slate-500 mb-1">請假號碼:</label><input type="text" placeholder="例: 7" value={settings.leaveIds} onChange={(e) => setSettings({...settings, leaveIds: e.target.value})} className="w-full p-2 md:p-3 border border-slate-200 rounded-lg text-base bg-white focus:ring-2 focus:ring-pink-300 outline-none" /></div>
                            <div><label className="block text-sm font-bold text-slate-500 mb-1">上社團號碼:</label><input type="text" placeholder="例: 12,15" value={settings.clubIds} onChange={(e) => setSettings({...settings, clubIds: e.target.value})} className="w-full p-2 md:p-3 border border-slate-200 rounded-lg text-base bg-white focus:ring-2 focus:ring-pink-300 outline-none" /></div>
                          </div>
                        </div>
                        <div className="mb-4 flex items-center justify-between bg-rose-50 p-4 rounded-xl border border-rose-100 shadow-sm">
                          <div className="flex items-center gap-3">
                            <Unlock className="text-rose-500 shrink-0 pointer-events-none" size={20}/><span className="text-sm md:text-base font-bold text-rose-700 shrink-0">強制解鎖:</span>
                            <input type="number" placeholder="座號" className="w-20 md:w-24 p-2 border border-rose-200 rounded-lg text-base bg-white text-center focus:outline-none focus:ring-2 focus:ring-rose-300 transition-all" value={unlockId} onChange={(e)=>setUnlockId(e.target.value)}/>
                            <button type="button" onClickCapture={(e) => { e.stopPropagation(); handleUnlock(); }} className="px-4 py-2 bg-rose-500 text-white rounded-lg text-sm md:text-base font-bold hover:bg-rose-600 shadow-sm transition-colors">執行</button>
                          </div>
                        </div>
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden">
                          <div className="absolute top-0 left-0 w-1 h-full bg-blue-400"></div><h5 className="font-bold text-slate-700 text-sm md:text-base mb-2">方式 B：匯入學生名單</h5>
                          <textarea className="w-full h-32 p-3 border border-slate-200 rounded-xl text-base bg-white custom-scrollbar resize-y focus:ring-2 focus:ring-blue-300 outline-none leading-relaxed" placeholder="1,王小明&#10;2,陳小華" value={settings.bulkText} onChange={(e) => setSettings({...settings, bulkText: e.target.value})} />
                        </div>
                      </section>
                      <section>
                        <h4 className="text-sm md:text-base font-bold text-slate-400 mb-3 border-b border-slate-100 pb-2 flex items-center gap-2">🔤 聯絡簿顯示字體</h4>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5 p-2 bg-slate-50 rounded-xl border border-slate-100">
                          <label className="flex-1 cursor-pointer"><input type="radio" name="cbFont" value="sans" className="peer hidden" checked={settings.cbFont === 'sans'} onChange={(e)=>setSettings({...settings, cbFont: e.target.value})} /><div className="text-center py-3 h-full flex items-center justify-center rounded-lg text-sm md:text-base font-bold text-slate-500 peer-checked:bg-white peer-checked:text-pink-600 peer-checked:shadow-sm transition-all border border-transparent peer-checked:border-pink-100">黑體(預設)</div></label>
                          <label className="flex-1 cursor-pointer"><input type="radio" name="cbFont" value="kai" className="peer hidden" checked={settings.cbFont === 'kai'} onChange={(e)=>setSettings({...settings, cbFont: e.target.value})} /><div className="text-center py-3 h-full flex items-center justify-center rounded-lg text-sm md:text-base font-bold text-slate-500 font-kai peer-checked:bg-white peer-checked:text-pink-600 peer-checked:shadow-sm transition-all border border-transparent peer-checked:border-pink-100">標楷體</div></label>
                          <label className="flex-1 cursor-pointer"><input type="radio" name="cbFont" value="bopomofo" className="peer hidden" checked={settings.cbFont === 'bopomofo'} onChange={(e)=>setSettings({...settings, cbFont: e.target.value})} /><div className="text-center py-2 px-1 h-full flex flex-col items-center justify-center rounded-lg font-bold text-slate-500 font-bopomofo peer-checked:bg-white peer-checked:text-pink-600 peer-checked:shadow-sm transition-all border border-transparent peer-checked:border-pink-100 leading-tight"><span className="text-sm md:text-base">含漢字注音</span><span className="text-[10px] md:text-xs font-sans opacity-70 mt-0.5">(三種字型)</span></div></label>
                          <label className="flex-1 cursor-pointer"><input type="radio" name="cbFont" value="zhuyinOnly" className="peer hidden" checked={settings.cbFont === 'zhuyinOnly'} onChange={(e)=>setSettings({...settings, cbFont: e.target.value})} /><div className="text-center py-2 px-1 h-full flex flex-col items-center justify-center rounded-lg font-bold text-slate-500 font-zhuyin-only peer-checked:bg-white peer-checked:text-pink-600 peer-checked:shadow-sm transition-all border border-transparent peer-checked:border-pink-100 leading-tight"><span className="text-sm md:text-base">僅注音</span><span className="text-[10px] md:text-xs font-sans opacity-70 mt-0.5">(文鼎寬字)</span></div></label>
                        </div>
                        <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-amber-900 shadow-sm text-sm md:text-base">
                          <h6 className="font-black mb-2 flex items-center gap-1.5 text-amber-700">💡 字型安裝說明</h6>
                          <p className="text-xs md:text-sm mb-3 font-medium opacity-80 leading-relaxed">為確保聯絡簿的注音排版正確顯示，請先上網搜尋下載並在電腦安裝以下免費字型：</p>
                          <div className="bg-white/60 rounded-lg p-3 border border-amber-200/50 mb-3 space-y-3">
                            <div><span className="font-bold text-amber-700 text-xs md:text-sm px-2 py-1 bg-amber-100 rounded-md mr-2">對應：含漢字注音</span><ul className="list-disc ml-6 text-xs md:text-sm font-bold mt-2 space-y-1 text-amber-800"><li>王漢宗中楷體注音</li><li>文鼎中楷注音</li><li>全字庫注音體</li></ul></div>
                            <div className="border-t border-amber-100 pt-3"><span className="font-bold text-blue-700 text-xs md:text-sm px-2 py-1 bg-blue-100 rounded-md mr-2">對應：僅注音</span><ul className="list-disc ml-6 text-xs md:text-sm font-bold mt-2 text-amber-800"><li>文鼎注音寬字</li></ul></div>
                          </div>
                          <div className="text-xs md:text-sm font-black text-rose-500 bg-rose-50 px-4 py-3 rounded-lg border border-rose-100 flex items-start gap-1.5"><span className="shrink-0 mt-0.5">⚠️</span><span>安裝完畢後，請務必「重新整理」此網頁，新字型才會生效！</span></div>
                        </div>
                      </section>
                    </div>
                  </div>
                </div>
              )}

              {isResetConfirmOpen && (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[999999] p-4">
                  <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
                    <div className="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6"><RotateCcw size={40} className="pointer-events-none"/></div>
                    <h3 className="text-xl font-black text-slate-800 mb-3">確定重置打卡？</h3>
                    <p className="text-slate-500 text-sm mb-6">所有的學生打卡狀態都將恢復為「未到」。</p>
                    <div className="flex gap-4">
                      <button type="button" onClickCapture={(e) => { e.stopPropagation(); setIsResetConfirmOpen(false); }} className="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-xl transition-colors hover:bg-slate-200">取消</button>
                      <button type="button" onClickCapture={(e) => { e.stopPropagation(); setStudents(prev => prev.map(s => ({ ...s, arrivalTime: null, status: 'absent' }))); setIsResetConfirmOpen(false); showToast('✅ 狀態已全部重置！'); }} className="flex-1 py-4 bg-red-500 text-white font-bold rounded-xl shadow-lg transition-colors hover:bg-red-600">確定</button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function App() {
          const [currentUser, setCurrentUser] = React.useState(null);

          const handleLogin = (user) => setCurrentUser(user);
          const handleLogout = () => setCurrentUser(null);

          if (!currentUser) return <LoginScreen onLogin={handleLogin} />;
          return <SchoolCheckInKing currentUser={currentUser} onLogout={handleLogout} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
