<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⭐學生打卡＆數位聯絡簿⭐</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 與 ReactDOM (UMD 版本) -->

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Firebase SDK (Compat 版本，適合單頁 HTML) -->

    <!-- 💡 核心修復：強制 Babel 使用 Classic Runtime -->

        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]

    <!-- =====================================================
         🔥 Firebase 設定區 - 請填入您的 Firebase 專案設定
         =====================================================
         步驟：
         1. 前往 https://console.firebase.google.com/
         2. 建立或選擇您的專案
         3. 點選「專案設定」>「一般」>「您的應用程式」
         4. 複製 firebaseConfig 物件並貼上至下方
         5. 在 Firebase 控制台啟用「Realtime Database」
         6. 將資料庫規則設為：
            {
              "rules": {
                ".read": true,
                ".write": true
              }
            }
            （初始測試用，正式部署請設定更嚴格的規則）
         ===================================================== -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBq0CBjXEXUsIaXR8q61FMIMWuEDjrql04",
            authDomain: "my-first-firebase-9f9c8.firebaseapp.com",
            databaseURL: "https://my-first-firebase-9f9c8-default-rtdb.firebaseio.com",
            projectId: "my-first-firebase-9f9c8",
            storageBucket: "my-first-firebase-9f9c8.firebasestorage.app",
            messagingSenderId: "751174424262",
            appId: "1:751174424262:web:b8e3777a54749b82bce9c7"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // =====================================================
        // 初始帳號設定（首次使用時自動寫入 Firebase）
        // 帳號格式：{ username, password, role, studentId(選填) }
        // role 可以是：'admin' | 'editor' | 'student'
        // =====================================================
        const INITIAL_USERS = [
            // 管理者（第一層）- 擁有所有功能
            { username: "admin", password: "admin123", role: "admin" },

            // 編輯者（第二層）- 最多 10 名，擁有聯絡簿編修權限
            { username: "editor01", password: "edit0001", role: "editor" },
            { username: "editor02", password: "edit0002", role: "editor" },
            { username: "editor03", password: "edit0003", role: "editor" },

            // 打卡者（第三層）- 最多 50 名，僅能依座號打卡自己
            // studentId 對應打卡頁面的座號
            { username: "s001", password: "stu001", role: "student", studentId: 1 },
            { username: "s002", password: "stu002", role: "student", studentId: 2 },
            { username: "s003", password: "stu003", role: "student", studentId: 3 },
        ];

        // 首次初始化：將預設帳號寫入 Firebase（只在 users 節點不存在時執行）
        db.ref('users').once('value').then(snap => {
            if (!snap.exists()) {
                const usersObj = {};
                INITIAL_USERS.forEach((u, i) => {
                    const key = 'user_' + String(i + 1).padStart(3, '0');
                    usersObj[key] = {
                        username: u.username,
                        password: u.password,
                        role: u.role,
                        studentId: u.studentId || null
                    };
                });
                db.ref('users').set(usersObj);
                console.log('✅ 初始帳號已寫入 Firebase');
            }
        });
    </script>

<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic">
        const { useState, useEffect, useCallback, useRef } = React;

        // ============================================================
        // 內建圖示庫
        // ============================================================

        const Settings = (p) => <IconBase {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></IconBase>;
        const Download = (p) => <IconBase {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></IconBase>;
        const RotateCcw = (p) => <IconBase {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></IconBase>;

        const Unlock = (p) => <IconBase {...p}><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></IconBase>;
        const Monitor = (p) => <IconBase {...p}><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></IconBase>;
        const Layout = (p) => <IconBase {...p}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><line x1="3" x2="21" y1="9" y2="9"/><line x1="9" x2="9" y1="21" y2="9"/></IconBase>;
        const Maximize2 = (p) => <IconBase {...p}><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></IconBase>;
        const Upload = (p) => <IconBase {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></IconBase>;
        const Star = (p) => <IconBase {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const FileText = (p) => <IconBase {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></IconBase>;
        const LogIn = (p) => <IconBase {...p}><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></IconBase>;
        const LogOut = (p) => <IconBase {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></IconBase>;
        const Users = (p) => <IconBase {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconBase>;
        const Shield = (p) => <IconBase {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></IconBase>;
        const Key = (p) => <IconBase {...p}><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></IconBase>;
        const Plus = (p) => <IconBase {...p}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></IconBase>;
        const Trash2 = (p) => <IconBase {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconBase>;
        const Edit3 = (p) => <IconBase {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></IconBase>;
        const Eye = (p) => <IconBase {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const EyeOff = (p) => <IconBase {...p}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" x2="23" y1="1" y2="23"/></IconBase>;

        // ============================================================
        // 角色定義與輔助函數
        // ============================================================
        const ROLES = {
            admin: { label: '管理者', color: 'text-purple-700', bg: 'bg-purple-100', badgeClass: 'role-badge-admin', icon: '👑' },
            editor: { label: '編輯者', color: 'text-pink-700', bg: 'bg-pink-100', badgeClass: 'role-badge-editor', icon: '✏️' },
            student: { label: '打卡者', color: 'text-blue-700', bg: 'bg-blue-100', badgeClass: 'role-badge-student', icon: '🎒' },
            guest: { label: '訪客', color: 'text-slate-600', bg: 'bg-slate-100', badgeClass: 'role-badge-guest', icon: '👁️' },
        };

        const canAdmin = (role) => role === 'admin';
        const canEdit = (role) => role === 'admin' || role === 'editor';
        const canCheckIn = (role) => role === 'admin' || role === 'student';

        // ============================================================
        // 登入介面元件
        // ============================================================
        function LoginScreen({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showPwd, setShowPwd] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!username.trim() || !password.trim()) {
                    setError('請輸入帳號與密碼');
                    return;
                }
                setLoading(true);
                setError('');
                try {
                    const snap = await db.ref('users').once('value');
                    const usersData = snap.val() || {};
                    let found = null;
                    let foundKey = null;
                    Object.entries(usersData).forEach(([key, u]) => {
                        if (u.username === username.trim() && u.password === password.trim()) {
                            found = u;
                            foundKey = key;
                        }
                    });
                    if (found) {
                        onLogin({ ...found, uid: foundKey });
                    } else {
                        setError('帳號或密碼錯誤，請重試。');
                    }
                } catch (err) {
                    setError('連線 Firebase 失敗，請確認設定是否正確。');
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            const handleGuestLogin = () => {
                onLogin({ role: 'guest', username: '訪客', uid: null });
            };

            return (
                <div className="min-h-screen w-full bg-gradient-to-br from-slate-100 via-pink-50 to-purple-50 flex flex-col items-center justify-center p-4">
                    <div className="login-card bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
                        {/* 頂部標題區 */}
                        <div className="bg-gradient-to-r from-yellow-400 via-pink-400 to-purple-500 p-8 text-center">
                            <div className="text-5xl mb-3">⭐</div>
                            <h1 className="text-2xl font-black text-white drop-shadow-md tracking-wider">學生打卡＆數位聯絡簿</h1>
                            <p className="text-white/80 text-sm mt-1 font-medium">請登入以繼續使用</p>
                        </div>

                        {/* 登入表單 */}
                        <form onSubmit={handleLogin} className="p-8 space-y-5">
                            <div>
                                <label className="block text-sm font-bold text-slate-600 mb-2">帳號</label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={e => setUsername(e.target.value)}
                                    placeholder="請輸入帳號"
                                    className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl text-base focus:border-pink-400 focus:ring-2 focus:ring-pink-100 outline-none transition-all"
                                    autoComplete="username"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-slate-600 mb-2">密碼</label>
                                <div className="relative">
                                    <input
                                        type={showPwd ? 'text' : 'password'}
                                        value={password}
                                        onChange={e => setPassword(e.target.value)}
                                        placeholder="請輸入密碼"
                                        className="w-full px-4 py-3 border-2 border-slate-200 rounded-xl text-base focus:border-pink-400 focus:ring-2 focus:ring-pink-100 outline-none transition-all pr-12"
                                        autoComplete="current-password"
                                    />
                                    <button type="button" onClick={() => setShowPwd(!showPwd)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors p-1">
                                        {showPwd ? <EyeOff size={20}/> : <Eye size={20}/>}
                                    </button>
                                </div>
                            </div>

                            {error && (
                                <div className="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm font-medium flex items-center gap-2">
                                    <span>⚠️</span> {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full py-4 bg-gradient-to-r from-pink-500 to-purple-600 text-white font-black rounded-xl shadow-lg hover:shadow-xl transition-all hover:-translate-y-0.5 active:translate-y-0 disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-base"
                            >
                                {loading ? (
                                    <><div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> 驗證中...</>
                                ) : (
                                    <><LogIn size={20}/> 登入</>
                                )}
                            </button>

                            <div className="relative flex items-center gap-3">
                                <div className="flex-1 h-px bg-slate-200"></div>
                                <span className="text-slate-400 text-sm font-medium">或</span>
                                <div className="flex-1 h-px bg-slate-200"></div>
                            </div>

                            <button
                                type="button"
                                onClick={handleGuestLogin}
                                className="w-full py-3 border-2 border-slate-200 text-slate-500 font-bold rounded-xl hover:bg-slate-50 transition-all flex items-center justify-center gap-2 text-sm"
                            >
                                <Eye size={18}/> 以訪客身分觀看（僅限瀏覽）
                            </button>
                        </form>

                        {/* 權限說明 */}
                        <div className="px-8 pb-8">
                            <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                                <p className="text-xs font-bold text-slate-400 mb-3 flex items-center gap-1"><Shield size={12}/> 權限說明</p>
                                <div className="space-y-2">
                                    {[
                                        { icon: '👑', label: '管理者', desc: '擁有所有功能' },
                                        { icon: '✏️', label: '編輯者', desc: '可編修聯絡簿' },
                                        { icon: '🎒', label: '打卡者', desc: '僅能個人打卡' },
                                        { icon: '👁️', label: '訪客', desc: '僅能觀看' },
                                    ].map(item => (
                                        <div key={item.label} className="flex items-center gap-2 text-xs text-slate-500">
                                            <span>{item.icon}</span>
                                            <span className="font-bold text-slate-600 w-14">{item.label}</span>
                                            <span>{item.desc}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ============================================================
        // 帳號管理面板元件（僅管理者可見）
        // ============================================================
        function UserManagementPanel({ onClose, showToast }) {
            const [users, setUsers] = useState({});
            const [loading, setLoading] = useState(true);
            const [editingKey, setEditingKey] = useState(null);
            const [editForm, setEditForm] = useState({});
            const [newUser, setNewUser] = useState({ username: '', password: '', role: 'editor', studentId: '' });
            const [showNewForm, setShowNewForm] = useState(false);
            const [showPwdMap, setShowPwdMap] = useState({});

            useEffect(() => {
                const ref = db.ref('users');
                const handler = ref.on('value', snap => {
                    setUsers(snap.val() || {});
                    setLoading(false);
                });
                return () => ref.off('value', handler);
            }, []);

            const roleCounts = Object.values(users).reduce((acc, u) => {
                acc[u.role] = (acc[u.role] || 0) + 1;
                return acc;
            }, {});

            const startEdit = (key, user) => {
                setEditingKey(key);
                setEditForm({ ...user });
            };

            const saveEdit = async () => {
                if (!editForm.username || !editForm.password) {
                    showToast('❌ 帳號與密碼不可為空');
                    return;
                }
                // 檢查角色人數限制
                if (editForm.role === 'editor') {
                    const currentCount = Object.entries(users).filter(([k, u]) => u.role === 'editor' && k !== editingKey).length;
                    if (currentCount >= 10) { showToast('❌ 編輯者最多 10 名'); return; }
                }
                if (editForm.role === 'student') {
                    const currentCount = Object.entries(users).filter(([k, u]) => u.role === 'student' && k !== editingKey).length;
                    if (currentCount >= 50) { showToast('❌ 打卡者最多 50 名'); return; }
                }
                await db.ref('users/' + editingKey).set({
                    username: editForm.username,
                    password: editForm.password,
                    role: editForm.role,
                    studentId: editForm.role === 'student' ? (parseInt(editForm.studentId) || null) : null
                });
                setEditingKey(null);
                showToast('✅ 帳號已更新');
            };

            const deleteUser = async (key, user) => {
                if (user.role === 'admin') {
                    const adminCount = Object.values(users).filter(u => u.role === 'admin').length;
                    if (adminCount <= 1) { showToast('❌ 至少需保留一位管理者'); return; }
                }
                if (!window.confirm(`確定要刪除帳號「${user.username}」嗎？`)) return;
                await db.ref('users/' + key).remove();
                showToast('✅ 帳號已刪除');
            };

            const addUser = async () => {
                if (!newUser.username || !newUser.password) {

        function ChangePasswordPanel({ currentUser, onClose, showToast }) {
            const [oldPwd, setOldPwd] = useState('');

        // ============================================================
        // 主應用程式元件
        // ============================================================
        function SchoolCheckInKing({ currentUser, onLogout }) {
            const role = currentUser.role;
            const [isMounted, setIsMounted] = useState(false);
            useEffect(() => {
                const timer = setTimeout(() => { setIsMounted(true); }, 200);
                return () => clearTimeout(timer);
            }, []);

            const [leftPaneWidth, setLeftPaneWidth] = useState(45);
            const [taskHeight, setTaskHeight] = useState(30);
            const [taskWidth, setTaskWidth] = useState(30);
            const [isDraggingH, setIsDraggingH] = useState(false);
            const [isDraggingV, setIsDraggingV] = useState(false);
            const [isDraggingTaskW, setIsDraggingTaskW] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            const showToast = useCallback((msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3500);
            }, []);

            // Firebase 同步狀態
            const [settings, setSettingsState] = useState({
                totalStudents: 30, idealTime: '07:30', taskEndTime: '08:30', cbDirection: 'horizontal',
                cbFont: 'sans', cbFontSize: 32, clockStyle: 0, viewMode: 'both', showTasks: true,
                showListNumber: true, emptyIds: '', leaveIds: '', clubIds: '', bulkText: '',
            });
            const [students, setStudentsState] = useState([]);
            const [contactBookData, setContactBookDataState] = useState({});
            const [taskData, setTaskDataState] = useState({});
            const [fbLoaded, setFbLoaded] = useState(false);

            // 從 Firebase 讀取資料
            useEffect(() => {
                const ref = db.ref('appData');
                const handler = ref.on('value', snap => {
                    const data = snap.val() || {};
                    if (data.settings) setSettingsState(prev => ({ ...prev, ...data.settings }));
                    if (data.students) setStudentsState(data.students);
                    if (data.contactBookData) setContactBookDataState(data.contactBookData);
                    if (data.taskData) setTaskDataState(data.taskData);
                    setFbLoaded(true);
                });
                return () => ref.off('value', handler);
            }, []);

            // 寫入 Firebase 的輔助函數
            const setSettings = useCallback((newVal) => {
                const val = typeof newVal === 'function' ? newVal(settings) : newVal;
                setSettingsState(val);
                if (canAdmin(role)) db.ref('appData/settings').set(val);
            }, [settings, role]);

            const setStudents = useCallback((newVal) => {
                setStudentsState(prev => {
                    const val = typeof newVal === 'function' ? newVal(prev) : newVal;
                    // 管理者可以更新所有學生，打卡者只能更新自己的
                    if (canAdmin(role)) {
                        db.ref('appData/students').set(val);
                    } else if (role === 'student' && currentUser.studentId) {
                        // 只更新自己的那一筆
                        const myStudent = val.find(s => s.id === currentUser.studentId);
                        if (myStudent) {
                            const idx = val.findIndex(s => s.id === currentUser.studentId);
                            db.ref(`appData/students/${idx}`).set(myStudent);
                        }
                    }
                    return val;
                });
            }, [role, currentUser.studentId]);

            const setContactBookData = useCallback((newVal) => {
                const val = typeof newVal === 'function' ? newVal(contactBookData) : newVal;
                setContactBookDataState(val);
                if (canEdit(role)) db.ref('appData/contactBookData').set(val);
            }, [contactBookData, role]);

            const setTaskData = useCallback((newVal) => {
                const val = typeof newVal === 'function' ? newVal(taskData) : newVal;
                setTaskDataState(val);
                if (canEdit(role)) db.ref('appData/taskData').set(val);
            }, [taskData, role]);

            const [isEditing, setIsEditing] = useState(false);
            const [viewDate, setViewDate] = useState(new Date());
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);
            const [isUserMgmtOpen, setIsUserMgmtOpen] = useState(false);
            const [isChangePwdOpen, setIsChangePwdOpen] = useState(false);
            const [unlockId, setUnlockId] = useState('');

            const formatDateKey = useCallback((date) => {
                if (!date) return new Date().toISOString().split('T')[0];
                const d = new Date(date);
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().split('T')[0];
            }, []);

            const currentViewDateKey = formatDateKey(viewDate);

            useEffect(() => {
                if (!fbLoaded) return;
                const isWeekend = viewDate.getDay() === 0 || viewDate.getDay() === 6;
                const isToday = currentViewDateKey === formatDateKey(new Date());
                setContactBookData(prev => {
                    if (prev[currentViewDateKey] !== undefined) return prev;
                    return { ...prev, [currentViewDateKey]: (isToday && !isWeekend) ? "國習P.30-P.32\n國作L3\n數作Ch.3\n明帶水彩用具\n交午餐回條\n做家事" : "" };
                });
                setTaskData(prev => {
                    if (prev[currentViewDateKey] !== undefined) return prev;
                    return { ...prev, [currentViewDateKey]: (isToday && !isWeekend) ? "靜心晨讀10分鐘\n繳交今日作業\n抄寫聯絡簿" : "" };
                });
            }, [currentViewDateKey, viewDate, fbLoaded, formatDateKey]);

            useEffect(() => {
                if (!fbLoaded) return;
                setStudents(prev => {
                    let baseList = Array.from({ length: settings.totalStudents }, (_, i) => ({ id: i + 1, name: '', type: 'normal' }));
                    const safeEmptyIds = settings.emptyIds || '';
                    const safeImportText = settings.bulkText || '';
                    const emptyArr = safeEmptyIds.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

                    if (safeImportText.trim() !== '') {
                        const lines = safeImportText.split('\n').filter(l => l.trim() !== '');
                        let autoId = 1;
                        lines.forEach((line) => {
                            let name = line.trim();
                            let id = null;
                            const match = line.match(/^(\d+)[\s,\.\t]+(.+)$/);
                            if (match) {
                                id = parseInt(match[1], 10);
                                name = match[2].trim();
                                autoId = id + 1;
                            } else if (/^\d+$/.test(name)) {
                                id = parseInt(name, 10);
                                name = '';
                                autoId = id + 1;
                            } else {
                                while (emptyArr.includes(autoId) && autoId <= settings.totalStudents) { autoId++; }
                                id = autoId;
                                autoId++;
                            }
                            const student = baseList.find(s => s.id === id);
                            if (student) {
                                student.name = name;
                                if (name === '空號') student.type = 'empty';
                            }
                        });
                    }

                    const leaveArr = (settings.leaveIds || '').split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                    const clubArr = (settings.clubIds || '').split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

                    return baseList.map(base => {
                        const existing = prev.find(s => s.id === base.id) || { arrivalTime: null, status: 'absent' };
                        let finalType = base.type;
                        if (emptyArr.includes(base.id)) finalType = 'empty';
                        else if (leaveArr.includes(base.id)) finalType = 'leave';
                        else if (clubArr.includes(base.id)) finalType = 'club';
                        return { ...base, type: finalType, arrivalTime: existing.arrivalTime, status: existing.status };
                    });
                });
            }, [settings.totalStudents, settings.emptyIds, settings.leaveIds, settings.clubIds, settings.bulkText, fbLoaded]);

            useEffect(() => {
                const handleMouseMove = (e) => {
                    if (isDraggingH) {
                        const newWidth = (e.clientX / window.innerWidth) * 100;
                        if (newWidth > 20 && newWidth < 80) setLeftPaneWidth(newWidth);
                    }
                    if (isDraggingV) {
                        const container = document.getElementById('right-pane-container');
                        if (container) {
                            const rect = container.getBoundingClientRect();
                            const newHeight = ((rect.bottom - e.clientY) / rect.height) * 100;
                            if (newHeight > 10 && newHeight < 60) setTaskHeight(newHeight);
                        }
                    }
                    if (isDraggingTaskW) {
                        const container = document.getElementById('content-area-container');
                        if (container) {
                            const rect = container.getBoundingClientRect();
                            const newWidth = ((e.clientX - rect.left) / rect.width) * 100;
                            if (newWidth > 15 && newWidth < 50) setTaskWidth(newWidth);
                        }
                    }
                };
                const handleMouseUp = () => { setIsDraggingH(false); setIsDraggingV(false); setIsDraggingTaskW(false); };
                if (isDraggingH || isDraggingV || isDraggingTaskW) {
                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                    document.addEventListener('touchmove', (e) => handleMouseMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY }), { passive: false });
                    document.addEventListener('touchend', handleMouseUp);
                }
                return () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                    document.removeEventListener('touchmove', handleMouseMove);
                    document.removeEventListener('touchend', handleMouseUp);
                };
            }, [isDraggingH, isDraggingV, isDraggingTaskW]);

            // 打卡邏輯（依權限限制）
            const handleCheckIn = useCallback((id) => {
                // 訪客與編輯者不能打卡
                if (!canCheckIn(role)) return;
                // 打卡者只能打自己的座號
                if (role === 'student' && currentUser.studentId !== id) {
                    showToast('⚠️ 您只能打自己的座號（' + currentUser.studentId + '號）');
                    return;
                }
                setStudents(prev => prev.map(s => {
                    if (s.id !== id || s.type !== 'normal' || s.status !== 'absent') return s;
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
                    const [h, m] = (settings.idealTime || '07:30').split(':').map(Number);
                    const ideal = new Date(); ideal.setHours(h, m, 0, 0);
                    return { ...s, arrivalTime: timeStr, status: now <= ideal ? 'on-time' : 'late' };
                }));
            }, [settings.idealTime, setStudents, role, currentUser.studentId, showToast]);

            const handleUnlock = () => {
                if (!canAdmin(role)) return;
                const id = parseInt(unlockId);
                setStudents(prev => prev.map(s => s.id === id ? { ...s, arrivalTime: null, status: 'absent' } : s));
                setUnlockId('');
            };

            const triggerDownload = (content, fileName, mimeType) => {
                try {
                    const blob = new Blob([content], { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    a.target = '_blank';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 150);
                    showToast('✅ 檔案已請求下載！');
                } catch (err) {
                    showToast('⚠️ 下載被預覽環境阻擋，請確認權限或在新分頁開啟。');

            };

            const exportCSV = () => {
                if (!canAdmin(role)) return;
                const dateStr = formatDateKey(viewDate);
                const cbText = (contactBookData[currentViewDateKey] || '').replace(/"/g, '""');
                const taskText = (taskData[currentViewDateKey] || '').replace(/"/g, '""');
                const currentStats = {
                    total: students.filter(s => s.type !== 'empty').length,
                    present: students.filter(s => (s.status === 'on-time' || s.status === 'late')).length,

                    absent: students.filter(s => s.status === 'absent' && s.type === 'normal').length,
                    leave: students.filter(s => s.type === 'leave').length,
                    club: students.filter(s => s.type === 'club').length,

                csvContent += `報表日期,${dateStr}\n\n`;
                csvContent += `【今日聯絡簿】\n"${cbText}"\n\n`;
                csvContent += `【早自習任務】\n"${taskText}"\n\n`;
                csvContent += `【出缺席統計】\n應到,已到,遲到,未到,請假,社團\n`;
                csvContent += `${currentStats.total},${currentStats.present},${currentStats.late},${currentStats.absent},${currentStats.leave},${currentStats.club}\n\n`;
                csvContent += `【學生打卡明細】\n座號,姓名,狀態,打卡時間\n`;
                students.forEach(s => {
                    if (s.type === 'empty') return;
                    let statusText = '未到';
                    if (s.status === 'on-time') statusText = '準時';
                    else if (s.status === 'late') statusText = '遲到';
                    else if (s.type === 'leave') statusText = '請假';
                    else if (s.type === 'club') statusText = '社團';
                    const name = (s.name || '').replace(/"/g, '""');
                    const time = s.arrivalTime || '';
                    csvContent += `${s.id},"${name}",${statusText},${time}\n`;
                });
                triggerDownload(csvContent, `⭐學生打卡報表_${dateStr}.csv`, 'text/csv;charset=utf-8;');
            };

            const exportData = () => {
                if (!canAdmin(role)) return;
                const data = { settings, students, contactBookData, taskData };
                triggerDownload(JSON.stringify(data), `⭐學生打卡＆數位聯絡簿⭐_備份_${formatDateKey(new Date())}.json`, 'application/json');
            };

            const handleFileUpload = (e) => {
                if (!canAdmin(role)) return;
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        if (json.settings) setSettings(prev => ({ ...prev, ...json.settings }));
                        if (json.students) setStudentsState(json.students);
                        if (json.contactBookData) setContactBookData(prev => ({ ...prev, ...json.contactBookData }));

                total: students.filter(s => s.type !== 'empty').length,
                present: students.filter(s => (s.status === 'on-time' || s.status === 'late')).length,
                late: students.filter(s => s.status === 'late').length,
                absent: students.filter(s => s.status === 'absent' && s.type === 'normal').length,

                club: students.filter(s => s.type === 'club').length,

                                    </div>

                        } else if (isBopomofo) {
                            return (
                                <span key={i} style={{ display: 'inline-flex', alignItems: 'center', position: 'relative', verticalAlign: 'middle', fontFamily: '"標楷體", "DFKai-SB", "BiauKai", serif', marginRight: '0.1em' }}>
                                    <span className="leading-none" style={{ letterSpacing: 'normal' }}>{part}</span>
                                    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', fontSize: part === '數' ? '0.45em' : '0.32em', lineHeight: '1.1', paddingLeft: '0.02em', fontFamily: 'sans-serif', writingMode: 'horizontal-tb', letterSpacing: 'normal' }}>
                                        {part === '數' ? <><span style={{ marginBottom: '0.05em' }}>ㄕ</span><span style={{ position: 'relative', display: 'inline-block' }}>ㄨ<span style={{ position: 'absolute', top: '-0.15em', left: '100%', marginLeft: '0.05em', fontSize: '0.9em', fontWeight: 'bold', lineHeight: '1' }}>ˋ</span></span></> : <><span style={{ marginBottom: '0.02em' }}>ㄐ</span><span style={{ marginBottom: '0.02em' }}>ㄩ</span><span style={{ position: 'relative', display: 'inline-block' }}>ㄢ<span style={{ position: 'absolute', top: '-0.15em', left: '100%', marginLeft: '0.05em', fontSize: '0.9em', fontWeight: 'bold', lineHeight: '1' }}>ˋ</span></span></>}
                                    </div>
                                </span>
                            );
                        }
                    } else if (testRegex.test(part) && part.length <= 6) {
                        const isDash = part === '-';
                        return <span key={i} className={`${isVertical ? 'tate-chu-yoko' : ''} inline-block font-sans`} style={{ margin: (isBopomofo && !isVertical) ? '0 0.1em 0 0.2em' : '0 0.1em', fontWeight: isZhuyinOnly ? '900' : 'normal', verticalAlign: 'middle', fontSize: isZhuyinOnly ? '1.4em' : '1em', letterSpacing: 'normal', transform: (isVertical && isDash) ? 'rotate(90deg)' : 'none', position: (isBopomofo && !isVertical) ? 'relative' : 'static', top: (isBopomofo && !isVertical) ? '-0.15em' : '0' }}>{part}</span>;
                    }
                    return <span key={i} style={isZhuyinOnly ? { fontSize: '1.65em', lineHeight: '1', verticalAlign: 'middle', textAlign: 'center' } : { verticalAlign: 'middle', lineHeight: '1.2', position: (isBopomofo && !isVertical) ? 'relative' : 'static', top: (isBopomofo && !isVertical) ? '-0.15em' : '0' }}>{part}</span>;
                });
            };

            const getWeekdayString = (date) => ['日', '一', '二', '三', '四', '五', '六'][date.getDay()];
            const getFontClass = () => settings.cbFont === 'bopomofo' ? "font-bopomofo" : settings.cbFont === 'zhuyinOnly' ? "font-zhuyin-only" : settings.cbFont === 'kai' ? "font-kai" : "font-sans";

            // 打卡按鈕的可點擊性判斷
            const isStudentClickable = (s) => {
                if (s.type !== 'normal' || s.status !== 'absent') return false;
                if (canAdmin(role)) return true;
                if (role === 'student' && currentUser.studentId === s.id) return true;
                return false;
            };

            return (
                <div className="min-h-[100dvh] w-full bg-[#f3f4f6] flex flex-col font-sans selection:bg-pink-200 overflow-hidden">
                    {toastMessage && (
                        <div style={{ pointerEvents: 'none' }} className="fixed top-1/4 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] z-[999999] animate-bounce font-bold text-sm text-center tracking-wide border-2 border-white/20">
                            {toastMessage}

                    {/* ===== 頂部導覽列 ===== */}
                    <header className="flex-none pt-14 pb-4 bg-white px-4 md:px-6 flex flex-wrap items-center justify-between border-b-2 border-pink-50 shadow-sm relative z-[99999]">

                            <div className="bg-gradient-to-r from-yellow-400 to-pink-500 p-2.5 rounded-xl shadow-sm rotate-3">
                                <Star className="text-white w-5 h-5 fill-current pointer-events-none" />
                            </div>
                            <h1 className="text-xl md:text-2xl font-black text-slate-700 pointer-events-none">⭐學生打卡＆數位聯絡簿⭐</h1>
                        </div>

                        <div className="flex items-center gap-2 md:gap-3 flex-wrap">
                            {/* 檢視模式切換（管理者與訪客可用） */}

                                <button type="button" onClickCapture={(e) => { e.stopPropagation(); setSettings({...settings, viewMode:'both'}); }} className={`flex items-center gap-2 px-4 py-2.5 md:px-5 md:py-3 rounded-lg text-sm font-black transition-all hover:bg-white/90 ${settings.viewMode==='both'?'bg-white shadow-md text-pink-600':'text-slate-500'}`}>
                                    <Layout size={20} className="pointer-events-none"/> <span className="hidden md:inline pointer-events-none">分屏顯示</span>
                                </button>
                                <button type="button" onClickCapture={(e) => { e.stopPropagation(); setSettings({...settings, viewMode:'checkin'}); }} className={`flex items-center gap-2 px-4 py-2.5 md:px-5 md:py-3 rounded-lg text-sm font-black transition-all hover:bg-white/90 ${settings.viewMode==='checkin'?'bg-white shadow-md text-pink-600':'text-slate-500'}`}>
                                    <Monitor size={20} className="pointer-events-none"/> <span className="hidden md:inline pointer-events-none">打卡</span>
                                </button>
                                <button type="button" onClickCapture={(e) => { e.stopPropagation(); setSettings({...settings, viewMode:'blackboard'}); }} className={`flex items-center gap-2 px-4 py-2.5 md:px-5 md:py-3 rounded-lg text-sm font-black transition-all hover:bg-white/90 ${settings.viewMode==='blackboard'?'bg-white shadow-md text-pink-600':'text-slate-500'}`}>
                                    <FileText size={20} className="pointer-events-none"/> <span className="hidden md:inline pointer-events-none">聯絡簿</span>

                                        <RotateCcw size={18} className="pointer-events-none"/> <span className="hidden md:inline pointer-events-none">重置</span>

                                        <Upload size={18} className="pointer-events-none"/> <span className="hidden md:inline pointer-events-none">匯入</span>

                                        <Users size={18} className="pointer-events-none"/> <span className="hidden md:inline pointer-events-none">帳號</span>

                            {/* 使用者資訊與登出 */}
                            <div className="flex items-center gap-2 pl-2 border-l border-slate-200 ml-1">

                                            {ROLES[role]?.icon} {ROLES[role]?.label || role}

                                    {role === 'student' && currentUser.studentId && (

                                </div>
                                {currentUser.uid && (
                                    <button type="button" onClick={() => setIsChangePwdOpen(true)} className="p-2 hover:bg-blue-50 text-blue-400 hover:text-blue-600 rounded-lg transition-colors" title="修改密碼">
                                        <Key size={16}/>

                                <button type="button" onClick={onLogout} className="p-2 hover:bg-red-50 text-red-400 hover:text-red-600 rounded-lg transition-colors" title="登出">
                                    <LogOut size={18}/>
                                </button>

                    {/* ===== 主內容區 ===== */}
                    <main className="flex-1 flex overflow-hidden p-2 md:p-4 gap-2 md:gap-4">
                        {/* 打卡區 */}
                        {(settings.viewMode === 'both' || settings.viewMode === 'checkin') && (
                            <section style={{ width: settings.viewMode === 'checkin' ? '100%' : `${leftPaneWidth}%` }} className="flex flex-col bg-white rounded-3xl shadow-lg border border-pink-50 overflow-hidden">
                                <div className="px-4 pt-4 pb-2 flex flex-wrap items-center justify-between gap-2 shrink-0 border-b border-pink-50">

                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5 p-2 bg-slate-50 rounded-xl border border-slate-100">
                                            <label className="flex-1 cursor-pointer"><input type="radio" name="cbFont" value="sans" className="peer hidden" checked={settings.cbFont === 'sans'} onChange={(e)=>setSettings({...settings, cbFont: e.target.value})} /><div className="text-center py-3 h-full flex items-center justify-center rounded-lg text-sm md
:text-base font-bold text-slate-500 peer-checked:bg-white peer-checked:text-pink-600 peer-checked:shadow-sm transition-all border border-transparent peer-checked:border-pink-100">黑體(預設)</div></label>
                                            <label className="flex-1 cursor-pointer"><input type="radio" name="cbFont" value="kai" className="peer hidden" checked={settings.cbFont === 'kai'} onChange={(e)=>setSettings({...settings, cbFont: e.target.value})} /><div className="text-center py-3 h-full flex items-center justify-center rounded-lg text-sm md:text-base font-bold text-slate-500 font-kai peer-checked:bg-white peer-checked:text-pink-600 peer-checked:shadow-sm transition-all border border-transparent peer-checked:border-pink-100">標楷體</div></label>
                                            <label className="flex-1 cursor-pointer"><input type="radio" name="cbFont" value="bopomofo" className="peer hidden" checked={settings.cbFont === 'bopomofo'} onChange={(e)=>setSettings({...settings, cbFont: e.target.value})} /><div className="text-center py-2 px-1 h-full flex flex-col items-center justify-center rounded-lg font-bold text-slate-500 font-bopomofo peer-checked:bg-white peer-checked:text-pink-600 peer-checked:shadow-sm transition-all border border-transparent peer-checked:border-pink-100 leading-tight"><span className="text-sm md:text-base">含漢字注音</span><span className="text-[10px] md:text-xs font-sans opacity-70 mt-0.5">(三種字型)</span></div></label>
                                            <label className="flex-1 cursor-pointer"><input type="radio" name="cbFont" value="zhuyinOnly" className="peer hidden" checked={settings.cbFont === 'zhuyinOnly'} onChange={(e)=>setSettings({...settings, cbFont: e.target.value})} /><div className="text-center py-2 px-1 h-full flex flex-col items-center justify-center rounded-lg font-bold text-slate-500 font-zhuyin-only peer-checked:bg-white peer-checked:text-pink-600 peer-checked:shadow-sm transition-all border border-transparent peer-checked:border-pink-100 leading-tight"><span className="text-sm md:text-base">僅注音</span><span className="text-[10px] md:text-xs font-sans opacity-70 mt-0.5">(文鼎寬字)</span></div></label>
                                        </div>
                                        <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-amber-900 shadow-sm text-sm md:text-base">
                                            <h6 className="font-black mb-2 flex items-center gap-1.5 text-amber-700">💡 字型安裝說明</h6>
                                            <p className="text-xs md:text-sm mb-3 font-medium opacity-80 leading-relaxed">為確保聯絡簿的注音排版正確顯示，請先上網搜尋下載並在電腦安裝以下免費字型：</p>
                                            <div className="bg-white/60 rounded-lg p-3 border border-amber-200/50 mb-3 space-y-3">
                                                <div><span className="font-bold text-amber-700 text-xs md:text-sm px-2 py-1 bg-amber-100 rounded-md mr-2">對應：含漢字注音</span><ul className="list-disc ml-6 text-xs md:text-sm font-bold mt-2 space-y-1 text-amber-800"><li>王漢宗中楷體注音</li><li>文鼎中楷注音</li><li>全字庫注音體</li></ul></div>
                                                <div className="border-t border-amber-100 pt-3"><span className="font-bold text-blue-700 text-xs md:text-sm px-2 py-1 bg-blue-100 rounded-md mr-2">對應：僅注音</span><ul className="list-disc ml-6 text-xs md:text-sm font-bold mt-2 text-amber-800"><li>文鼎注音寬字</li></ul></div>
                                            </div>
                                            <div className="text-xs md:text-sm font-black text-rose-500 bg-rose-50 px-4 py-3 rounded-lg border border-rose-100 flex items-start gap-1.5"><span className="shrink-0 mt-0.5">⚠️</span><span>安裝完畢後，請務必「重新整理」此網頁，新字型才會生效！</span></div>
                                        </div>
                                    </section>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ===== 重置確認對話框（管理者專屬）===== */}
                    {isResetConfirmOpen && canAdmin(role) && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-[999999] p-4">
                            <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
                                <div className="w-20 h-20 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6"><RotateCcw size={40} className="pointer-events-none"/></div>
                                <h3 className="text-xl font-black text-slate-800 mb-3">確定重置打卡？</h3>
                                <p className="text-slate-500 text-sm mb-6">所有的學生打卡狀態都將恢復為「未到」。</p>
                                <div className="flex gap-4">
                                    <button type="button" onClickCapture={(e) => { e.stopPropagation(); setIsResetConfirmOpen(false); }} className="flex-1 py-4 bg-slate-100 text-slate-600 font-bold rounded-xl transition-colors hover:bg-slate-200">取消</button>
                                    <button type="button" onClickCapture={(e) => {
                                        e.stopPropagation();
                                        const resetStudents = students.map(s => ({ ...s, arrivalTime: null, status: 'absent' }));
                                        setStudentsState(resetStudents);
                                        db.ref('appData/students').set(resetStudents);
                                        setIsResetConfirmOpen(false);
                                        showToast('✅ 狀態已全部重置！');
                                    }} className="flex-1 py-4 bg-red-500 text-white font-bold rounded-xl shadow-lg transition-colors hover:bg-red-600">確定</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ===== 帳號管理面板（管理者專屬）===== */}
                    {isUserMgmtOpen && canAdmin(role) && (
                        <UserManagementPanel onClose={() => setIsUserMgmtOpen(false)} showToast={showToast} />
                    )}

                    {/* ===== 修改密碼面板（所有登入使用者）===== */}
                    {isChangePwdOpen && currentUser.uid && (
                        <ChangePasswordPanel currentUser={currentUser} onClose={() => setIsChangePwdOpen(false)} showToast={showToast} />
                    )}
                </div>
            );
        }

        // ============================================================
        // 根應用程式元件（控制登入狀態）
        // ============================================================
        function App() {
            const [currentUser, setCurrentUser] = useState(null);

            const handleLogin = (user) => {
                setCurrentUser(user);
            };

            const handleLogout = () => {
                setCurrentUser(null);
            };

            if (!currentUser) {
                return <LoginScreen onLogin={handleLogin} />;
            }

            return <SchoolCheckInKing currentUser={currentUser} onLogout={handleLogout} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
